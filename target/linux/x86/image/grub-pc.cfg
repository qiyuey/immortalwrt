@SERIAL_CONFIG@
@TERMINAL_CONFIG@

set default="0"
set timeout="@TIMEOUT@"
set root='(hd0,msdos1)'

if [ -f /boot/intel-ucode.img ]; then
	if [ "$timeout" = "0" ]; then
		set timeout="3"
	fi
fi

menuentry "@TITLE@" {
	linux /boot/vmlinuz @ROOTPART@ @CMDLINE@
	if [ -f /boot/intel-ucode.img ]; then
		initrd /boot/intel-ucode.img
	fi
}
menuentry "@TITLE@ (failsafe)" {
	linux /boot/vmlinuz failsafe=true @ROOTPART@ @CMDLINE@
	if [ -f /boot/intel-ucode.img ]; then
		initrd /boot/intel-ucode.img
	fi
}

if [ -f /boot/intel-ucode.img ]; then
	menuentry "@TITLE@ (without CPU microcode)" {
		linux /boot/vmlinuz @ROOTPART@ @CMDLINE@ noinitrd
	}
fi
